name: Docker Build and Push

# Each run publishes the tags <major version>-<timestamp> of all the major versions of the matrix, with the same
# timestamp. After a run, update zabbixServer.zabbixServerHA.dbCreateUpgradeJob.image.tagSuffix in the Helm chart.
# See the "Release process" section of README.md.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/zabbix-community/zabbix-server-create-upgrade-db

jobs:
  set-timestamp:
    name: Set Global Timestamp
    runs-on: ubuntu-latest
    outputs:
      build-timestamp: ${{ steps.set-timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Calculate Build Timestamp
        id: set-timestamp
        run: |
          build_timestamp=$(date -u +%Y%m%d%H%M%S)
          echo "BUILD_TIMESTAMP=$build_timestamp" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push Multi-Arch Images
    needs: [set-timestamp]
    runs-on: ubuntu-latest
    env:
      BUILD_TIMESTAMP: ${{ needs.set-timestamp.outputs.build-timestamp }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Zabbix major versions. The base image is zabbix/zabbix-server-pgsql:alpine-<major version>-latest.
        # Use "include" with "tag_prefix" and "base_image" to build from an image without a major release in its tag,
        # e.g. a digest-pinned pre-release (trunk) image. Never use a pre-release image for a published major version:
        # its schema version is different from the one of the release
        major_version: ["6.0", "6.4", "7.0", "7.2", "7.4", "8.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAJOR_VERSION=${{ matrix.major_version }}
            BASE_IMAGE=${{ matrix.base_image || format('zabbix/zabbix-server-pgsql:alpine-{0}-latest', matrix.major_version) }}
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.tag_prefix || matrix.major_version }}-${{ env.BUILD_TIMESTAMP }}
