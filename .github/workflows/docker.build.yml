name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/zabbix-community/zabbix-server-create-upgrade-db

jobs:
  set-timestamp:
    name: Set Global Timestamp
    runs-on: ubuntu-latest
    outputs:
      build-timestamp: ${{ steps.set-timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Calculate Build Timestamp
        id: set-timestamp
        run: |
          build_timestamp=$(date -u +%Y%m%d%H%M%S)
          echo "BUILD_TIMESTAMP=$build_timestamp" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push Multi-Arch Images
    needs: [set-timestamp]
    runs-on: ubuntu-latest
    env:
      BUILD_TIMESTAMP: ${{ needs.set-timestamp.outputs.build-timestamp }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        major_version: ["6.0", "6.4", "7.0", "7.2", "7.4"]
        include:
          # pre-release: trunk images carry no major release in their tag, so pin a known build by digest
          # (zabbix/zabbix-server-pgsql:alpine-trunk = 8.0.0rc2 as of 2026-10-09)
          - major_version: "8.0"
            tag_prefix: "8.0-trunk"
            base_image: "zabbix/zabbix-server-pgsql:alpine-trunk@sha256:fa798bd0b8ebc3201672bd418841267e51443fef741931323b0c418086d8b092"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAJOR_VERSION=${{ matrix.major_version }}
            BASE_IMAGE=${{ matrix.base_image || format('zabbix/zabbix-server-pgsql:alpine-{0}-latest', matrix.major_version) }}
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.tag_prefix || matrix.major_version }}-${{ env.BUILD_TIMESTAMP }}
